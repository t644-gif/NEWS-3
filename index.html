const F=k=='sp'?[['😄','這個編輯很上道，下次還找他合作！','很滿意'],['😐','有配合一點，但還沒到讓我放心的程度。','普通'],['😠','怎麼老是不照我的意思？廣告預算要重新考慮了。','不開心']]:[['😌','有默契，這孩子可以放心交給他。','很滿意'],['😐','還算聽得進意見，再觀察看看。','普通'],['😤','太有自己的想法了…下次開會再說。','不開心']];
const f=F[ix];return `<div class="cast"><div class="av">${px(k)}<small>${k=='sp'?'金主':'老闆'}</small></div><div class="bs"><div class="bub"><span style="font-size:30px">${f[0]}</span> <b>${f[2]}</b><br>💭 OS：${f[1]}</div></div></div>`}
function jpg(el,name){if(!window.html2canvas){alert('下載圖片需要連上網路載入工具，請檢查網路後再試一次');return}
html2canvas(el,{scale:el.scrollHeight>3000?1.5:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true}).then(c=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()},'image/jpeg',.92)).catch(()=>alert('圖片產生失敗，請再試一次'))}
function dl(){jpg(document.querySelector('.paper'),PN+'-頭版.jpg')}
function dlr(){jpg(document.getElementById('rf'),ST.cls+'-'+ST.no+'-'+ST.name+'-反思頁.jpg')}
init();
